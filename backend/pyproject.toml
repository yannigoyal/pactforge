[project]
name = "pactforge-backend"
version = "0.1.0"
description = "pactForge FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=4",
    "email-validator>=2.3.0",
    "fastapi>=0.140.13",
    "google-genai>=2.14.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
